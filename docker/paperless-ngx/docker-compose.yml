services:
  paperless-broker:
    image: docker.io/valkey/valkey:9.0-alpine
    container_name: paperless-broker
    restart: unless-stopped
    volumes:
      - paperless-redis:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  paperless-db:
    image: docker.io/library/postgres:18
    container_name: paperless-db
    restart: unless-stopped
    volumes:
      - paperless-pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 5

  paperless-gotenberg:
    image: docker.io/gotenberg/gotenberg:8.38
    container_name: paperless-gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    security_opt:
      - no-new-privileges:true

  paperless-tika:
    image: docker.io/apache/tika:3.3.1.0
    container_name: paperless-tika
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.4
    container_name: paperless
    restart: unless-stopped
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-broker:
        condition: service_healthy
      paperless-gotenberg:
        condition: service_started
      paperless-tika:
        condition: service_started
    ports:
      - "8000:8000"
    dns:
      - 192.168.1.4
      - 1.1.1.1
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume
    environment:
      # Core
      PAPERLESS_URL: https://paperless.${DOMAIN}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_TIME_ZONE: Europe/Dublin
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}

      # Database / broker
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      PAPERLESS_REDIS: redis://paperless-broker:6379

      # Office docs / email
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000

      # Authentik
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
        {"openid_connect": {"SCOPE": ["openid", "profile", "email", "groups"],
        "OAUTH_PKCE_ENABLED": true,
        "APPS": [{"provider_id": "authentik", "name": "Authentik",
        "client_id": "${PAPERLESS_OIDC_CLIENT_ID}",
        "secret": "${PAPERLESS_OIDC_CLIENT_SECRET}",
        "settings": {"server_url": "https://auth.${DOMAIN}/application/o/paperless/.well-known/openid-configuration"}}]}}
      PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
      PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
      PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"
      PAPERLESS_SOCIAL_ACCOUNT_SYNC_SUPERUSER_GROUP: "Admin"
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless.rule=Host(`paperless.${DOMAIN}`)"
      - "traefik.http.routers.paperless.entrypoints=websecure"
      - "traefik.http.routers.paperless.tls.certresolver=letsencrypt"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
      - "homepage.docker=services-vm"
      - "homepage.group=Services"
      - "homepage.name=Paperless"
      - "homepage.icon=paperless-ngx.svg"
      - "homepage.href=https://paperless.${DOMAIN}"
      - "homepage.description=Document archive"

volumes:
  paperless-redis:
  paperless-pgdata:
  paperless-data:
  paperless-media:
  paperless-export:
  paperless-consume: